name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write    # OIDC federated token for Azure Trusted Signing

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: cyprobe-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-14
            artifact: cyprobe-darwin-amd64
          - target: x86_64-unknown-linux-gnu
            os: cybrium-ai-linux
            artifact: cyprobe-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact: cyprobe-linux-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: cyprobe-windows-amd64.exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            artifact: cyprobe-windows-arm64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Windows: pnet uses Npcap as its packet source. Need the Npcap
      # SDK (header + import-lib) on the runner so link.exe finds
      # `Packet.lib` / `wpcap.lib`. SDK is build-time only; we don't
      # redistribute it. End users install Npcap themselves at runtime
      # (one-line README note ships in the release zip).
      - name: Install Npcap SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdk = "$env:RUNNER_TEMP\npcap-sdk"
          Invoke-WebRequest -Uri https://npcap.com/dist/npcap-sdk-1.13.zip -OutFile "$env:RUNNER_TEMP\npcap-sdk.zip"
          Expand-Archive "$env:RUNNER_TEMP\npcap-sdk.zip" -DestinationPath $sdk
          $arch = if ('${{ matrix.target }}' -eq 'aarch64-pc-windows-msvc') { 'ARM64' } else { 'x64' }
          "LIB=$sdk\Lib\$arch;$env:LIB" >> $env:GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/cyprobe ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/cyprobe.exe ${{ matrix.artifact }}

      # ── MSI installer (Windows x86_64 only) ────────────────────────
      # cargo-wix builds a Windows MSI from wix/main.wxs for x86_64.
      # ARM64 Windows skipped — WiX MSIs are typically x86_64 only.
      # MSI is signed alongside the .exe (files-folder-filter exe,msi).
      - name: Install cargo-wix
        if: runner.os == 'Windows' && matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo install cargo-wix --version 0.3.9

      - name: Build MSI installer
        if: runner.os == 'Windows' && matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          cargo wix --no-build --nocapture `
            --target ${{ matrix.target }} `
            --output cyprobe-windows-amd64.msi
          Get-ChildItem cyprobe-*

      # ── Azure Trusted Signing (Windows binaries only) ──────────────
      # azure/login MUST run before trusted-signing-action so the
      # DefaultAzureCredential chain finds the OIDC token. FIC subject
      # is repo:cybrium-ai/cyprobe:ref_type:tag — tag pushes only.
      - name: Azure login (federated OIDC)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: azure/login@v2
        with:
          client-id:              ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:              ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign Windows binary via Azure Trusted Signing
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: Azure/trusted-signing-action@v0.5
        with:
          azure-tenant-id:              ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id:              ${{ secrets.AZURE_CLIENT_ID }}
          endpoint:                     https://cus.codesigning.azure.net/
          trusted-signing-account-name: cybrium-signing
          certificate-profile-name:     cybrium
          files-folder:                 .
          files-folder-filter:          exe,msi
          file-digest:                  SHA256
          timestamp-rfc3161:            http://timestamp.acs.microsoft.com
          timestamp-digest:             SHA256

      - name: Verify Windows signatures (exe + optional msi)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $files = @("${{ matrix.artifact }}")
          if (Test-Path "cyprobe-windows-amd64.msi") { $files += "cyprobe-windows-amd64.msi" }
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file
            Write-Host "$file"
            Write-Host "  Status: $($sig.Status)"
            Write-Host "  Signer: $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "Signature verification failed for $file : $($sig.Status)" }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Upload MSI artifact
        if: runner.os == 'Windows' && matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v4
        with:
          name: cyprobe-windows-amd64.msi
          path: cyprobe-windows-amd64.msi

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum cyprobe-* > checksums-sha256.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            cyprobe-*
            checksums-sha256.txt

      # ── Auto-publish Homebrew formula to cybrium-ai/homebrew-cli ──
      #
      # Renders Formula/cyprobe.rb with the new version + URLs +
      # SHA256s pulled from checksums-sha256.txt, then commits to the
      # tap repo. Same direct-commit pattern cyscan uses. End users on
      # `brew upgrade cybrium-ai/cli/cyprobe` get the new binary as
      # soon as this step completes.
      - name: Resolve version
        id: ver
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract per-platform SHA256s
        id: sums
        run: |
          {
            echo "darwin_arm64_sha=$(awk '/cyprobe-darwin-arm64$/  {print $1}' checksums-sha256.txt)"
            echo "darwin_amd64_sha=$(awk '/cyprobe-darwin-amd64$/  {print $1}' checksums-sha256.txt)"
            echo "linux_arm64_sha=$(awk  '/cyprobe-linux-arm64$/   {print $1}' checksums-sha256.txt)"
            echo "linux_amd64_sha=$(awk  '/cyprobe-linux-amd64$/   {print $1}' checksums-sha256.txt)"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: cybrium-ai/homebrew-cli
          token:      ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path:       homebrew-cli

      - name: Render + commit Formula/cyprobe.rb
        run: |
          VERSION="${{ steps.ver.outputs.tag }}"
          BASE="https://github.com/cybrium-ai/cyprobe/releases/download/v${VERSION}"
          mkdir -p homebrew-cli/Formula
          cat > homebrew-cli/Formula/cyprobe.rb <<RUBY
          class Cyprobe < Formula
            desc     "Cybrium Probe — OT/SCADA security scanner (Modbus, DNP3, BACnet)"
            homepage "https://github.com/cybrium-ai/cyprobe"
            license  "Apache-2.0"
            version  "${VERSION}"

            on_macos do
              on_arm do
                url    "${BASE}/cyprobe-darwin-arm64"
                sha256 "${{ steps.sums.outputs.darwin_arm64_sha }}"
              end
              on_intel do
                url    "${BASE}/cyprobe-darwin-amd64"
                sha256 "${{ steps.sums.outputs.darwin_amd64_sha }}"
              end
            end

            on_linux do
              on_arm do
                url    "${BASE}/cyprobe-linux-arm64"
                sha256 "${{ steps.sums.outputs.linux_arm64_sha }}"
              end
              on_intel do
                url    "${BASE}/cyprobe-linux-amd64"
                sha256 "${{ steps.sums.outputs.linux_amd64_sha }}"
              end
            end

            def install
              if OS.mac? && Hardware::CPU.arm?
                bin.install "cyprobe-darwin-arm64" => "cyprobe"
              elsif OS.mac?
                bin.install "cyprobe-darwin-amd64" => "cyprobe"
              elsif OS.linux? && Hardware::CPU.arm?
                bin.install "cyprobe-linux-arm64" => "cyprobe"
              else
                bin.install "cyprobe-linux-amd64" => "cyprobe"
              end
            end

            test do
              assert_match "cyprobe", shell_output("#{bin}/cyprobe --version")
            end
          end
          RUBY
          cd homebrew-cli
          git config user.name  "cybrium-bot"
          git config user.email "bot@cybrium.ai"
          git add Formula/cyprobe.rb
          git commit -m "cyprobe: bump to v${VERSION}" || echo "no changes"
          git push
