name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: cyprobe-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-14
            artifact: cyprobe-darwin-amd64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: cyprobe-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact: cyprobe-linux-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: cyprobe-windows-amd64.exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            artifact: cyprobe-windows-arm64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Windows: pnet uses Npcap as its packet source. Need the Npcap
      # SDK (header + import-lib) on the runner so link.exe finds
      # `Packet.lib` / `wpcap.lib`. SDK is build-time only; we don't
      # redistribute it. End users install Npcap themselves at runtime
      # (one-line README note ships in the release zip).
      - name: Install Npcap SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdk = "$env:RUNNER_TEMP\npcap-sdk"
          Invoke-WebRequest -Uri https://npcap.com/dist/npcap-sdk-1.13.zip -OutFile "$env:RUNNER_TEMP\npcap-sdk.zip"
          Expand-Archive "$env:RUNNER_TEMP\npcap-sdk.zip" -DestinationPath $sdk
          $arch = if ('${{ matrix.target }}' -eq 'aarch64-pc-windows-msvc') { 'ARM64' } else { 'x64' }
          "LIB=$sdk\Lib\$arch;$env:LIB" >> $env:GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/cyprobe ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/cyprobe.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum cyprobe-* > checksums-sha256.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            cyprobe-*
            checksums-sha256.txt
